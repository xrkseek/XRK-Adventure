<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>向日葵历险记</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --sky-top: #5eb3d4;
      --sky-bot: #c8eaf5;
      --sun: #ffd54a;
      --leaf: #3d8b4f;
      --soil: #6b4a2e;
      --ink: #1e2a1f;
      --panel: rgba(30, 42, 31, 0.88);
      --accent: #ff8a3d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #0d1510;
      color: #f4f7f0;
      font-family: "Noto Sans SC", sans-serif;
      overflow: hidden;
      user-select: none;
    }
    #wrap {
      height: 100%;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, #2a4a35 0%, transparent 55%),
        linear-gradient(180deg, #0d1510, #152218);
    }
    canvas {
      width: min(960px, 100vw);
      height: min(540px, 56.25vw, 100vh);
      max-height: 100vh;
      background: #000;
      border-radius: 10px;
      box-shadow: 0 20px 60px rgba(0,0,0,.55), 0 0 0 2px rgba(255,213,74,.25);
      image-rendering: pixelated;
      cursor: crosshair;
    }
    .hint {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      opacity: .55;
      letter-spacing: .04em;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="960" height="540"></canvas>
  </div>
  <p class="hint">A/D 或 ←→ 移动 · W/空格 跳跃 · J 或 鼠标左键 射击 · R 重开</p>
  <script src="game.js"></script>
</body>
</html>
